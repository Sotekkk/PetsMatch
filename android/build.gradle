allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Certains plugins (ex. photo_manager) déclarent une cible Java (javac) sans
// fixer explicitement la cible Kotlin correspondante, qui hérite alors du JDK
// utilisé par Gradle (ex. 21) au lieu de matcher leur propre javac (17) —
// d'où l'erreur "Inconsistent JVM Target Compatibility". On harmonise les
// deux à 17 pour tous les modules SAUF :app, qui fixe déjà explicitement
// Java/Kotlin sur 1.8 dans son propre build.gradle.
subprojects {
    if (project.name != 'app') {
        afterEvaluate { proj ->
            if (proj.hasProperty('android')) {
                proj.android {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
            }
            proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}

buildscript {
    ext {
        minSdkVersion = 23
        kotlin_version = '2.0.21'
    }
    repositories {
        google() // Doit être en premier
        mavenCentral()
        // Autres repositories si nécessaire
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "com.google.gms:google-services:4.4.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Autres dépendances de classpath pour les plugins Gradle
    }
}

